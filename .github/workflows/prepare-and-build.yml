
name: Preparar e compilar CompriFy

on:
  push:
    paths:
      - 'comprify-source.zip'
      - '.github/workflows/prepare-and-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          mkdir -p "$RUNNER_TEMP/comprify-source"
          unzip -q comprify-source.zip -d "$RUNNER_TEMP/comprify-source"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/comprify-source" -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Arquivo settings.gradle.kts nao encontrado"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Modulo app nao encontrado"
            exit 1
          fi
          echo "COMPRIFY_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Executar testes e compilar APK
        working-directory: ${{ env.COMPRIFY_PROJECT_DIR }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CompriFy-APK-debug
          path: ${{ env.COMPRIFY_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
